spring:
  application:
    name: pharma-backend

  profiles:
    active: dev

  servlet:
    multipart:
      # Defaults are 1MB/10MB, which a few thousand rows of product bulk upload exceeds.
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO

app:
  cookie:
    domain: